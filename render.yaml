services:
  - type: web
    name: loan-eligibility-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: trust Render's reverse proxy (X-Forwarded-For/Proto)
    # so rate limiting sees the real client IP and URLs use https.
    # alembic upgrade head runs first (Postgres has no sqlite fallback);
    # the app's lifespan create_all only covers sqlite/tests.
    startCommand: alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 10000 --proxy-headers
    envVars:
      # sync: false -> set manually in the Render dashboard (never committed).
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: loan-db
          property: connectionString
      # Interpreter the pickles were built/tested under (venv: 3.12.10).
      - key: PYTHON_VERSION
        value: 3.12.10
      # Browser origins allowed to call the API (UI service + local dev).
      - key: CORS_ALLOWED_ORIGINS
        value: https://loan-eligibility-ui.onrender.com,http://localhost:8501

  - type: web
    name: loan-eligibility-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # NOTE: installs the full ML requirements even though the UI only needs
    # streamlit/requests/matplotlib/fpdf2 (see report: split requirements-ui.txt).
    # $PORT is provided by Render; --server.headless true avoids browser launch.
    startCommand: streamlit run ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: API_URL
        value: https://loan-eligibility-api.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.10

databases:
  - name: loan-db
    plan: free
